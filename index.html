<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>MyRadio</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151c2e; --text:#f5f7fb; --muted:#c8d2f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif; color:var(--text); background:radial-gradient(ellipse at top,#202a49 0%,var(--bg) 58%); }
    main { width:min(100%,520px); text-align:center; background:rgba(21,28,46,.92); border:1px solid #2b3650; border-radius:28px; padding:36px 28px 34px; box-shadow:0 24px 70px #0005; }
    .mark { width:76px; height:76px; margin:0 auto 20px; display:grid; place-items:center; border-radius:24px; background:linear-gradient(135deg,#8b9cff,#b48bff); color:#10162a; }
    h1 { margin:0; font-size:clamp(2rem,7vw,2.7rem); letter-spacing:-.04em; }
    .subtitle { margin:18px 0 7px; font-size:1.28rem; font-weight:700; line-height:1.7; }
    .tagline { margin:0 0 34px; color:var(--muted); font-size:1rem; line-height:1.7; }
    .wait { margin:0; color:#fff; font-size:1.08rem; font-weight:650; line-height:1.7; }
    .pulse { display:inline-block; width:8px; height:8px; margin-right:9px; border-radius:50%; background:#a18bff; vertical-align:middle; }
    @media (max-width:420px) { main { padding:30px 20px; } .subtitle { font-size:1.15rem; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
        <path d="M8 20v8M16 13v22M24 7v34M32 15v18M40 20v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>MyRadio</h1>
    <div class="subtitle">मेरे पसंदीदा गाने</div>
    <div class="tagline">संगीत का सच्चा आनंद</div>
    <p class="wait"><span class="pulse"></span>एक मिनट रुकिए तो…</p>
    <div style="margin-top:28px">
  <audio id="player" controls preload="none" style="width:100%">
    Your browser does not support audio.
  </audio>
  <p id="songTitle" style="color:#c8d2f0;margin-top:12px">
    गाना चुनिए
  </p>
</div>
  </main>
  
<script>
const API = "https://myradio-service.vivek-thakar-nsk.workers.dev";
const player = document.getElementById("player");
const songTitle = document.getElementById("songTitle");

let songs = [];
let remaining = [];
let currentSong = null;

function shuffleSongs(list) {
  const result = [...list];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

async function loadPlaylist() {
  songTitle.textContent = "गाने लोड हो रहे हैं…";
  try {
    const response = await fetch(`${API}/api/files`);
    const data = await response.json();

    if (!response.ok || !data.success || !data.items?.length) {
      throw new Error(data.error || "Playlist could not be loaded");
    }

    songs = data.items.filter(song =>
      song.type === "file" &&
      (song.extension || song.name.split(".").pop()).toLowerCase() === "mp3"
    );

    if (!songs.length) throw new Error("No MP3 songs found");

    remaining = shuffleSongs(songs);
    songTitle.textContent = `${songs.length} गाने तैयार हैं — Play दबाइए`;
    player.addEventListener("play", () => {
      if (!player.src || player.src === window.location.href) playNext();
    });
  } catch (error) {
    songTitle.textContent = "गाने लोड नहीं हुए। पेज फिर खोलें।";
    console.error("MyRadio playlist error:", error);
  }
}

function playNext() {
  if (!remaining.length) {
    remaining = shuffleSongs(songs);
  }

  currentSong = remaining.pop();
  songTitle.textContent = currentSong.name.replace(/\.mp3$/i, "");
  player.src = `${API}/api/audio?id=${encodeURIComponent(currentSong.id)}`;
  player.play().catch(error => {
    songTitle.textContent = "गाना चलाने में समस्या — Play फिर दबाइए";
    console.error("MyRadio playback error:", error);
  });
}

player.addEventListener("ended", playNext);

loadPlaylist();
</script>

</body>
</html>
