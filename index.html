<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>MyRadio</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151c2e; --text:#f5f7fb; --muted:#c8d2f0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif; color:var(--text); background:radial-gradient(ellipse at top,#202a49 0%,var(--bg) 58%); }
    main { width:min(100%,520px); text-align:center; background:rgba(21,28,46,.92); border:1px solid #2b3650; border-radius:28px; padding:36px 28px 34px; box-shadow:0 24px 70px #0005; }
    .mark { width:76px; height:76px; margin:0 auto 20px; display:grid; place-items:center; border-radius:24px; background:linear-gradient(135deg,#8b9cff,#b48bff); color:#10162a; }
    h1 { margin:0; font-size:clamp(2rem,7vw,2.7rem); letter-spacing:-.04em; }
    .subtitle { margin:18px 0 7px; font-size:1.28rem; font-weight:700; line-height:1.7; }
    .tagline { margin:0 0 34px; color:var(--muted); font-size:1rem; line-height:1.7; }
    .wait { margin:0; color:#fff; font-size:1.08rem; font-weight:650; line-height:1.7; }
    .pulse { display:inline-block; width:8px; height:8px; margin-right:9px; border-radius:50%; background:#a18bff; vertical-align:middle; }
    @media (max-width:420px) { main { padding:30px 20px; } .subtitle { font-size:1.15rem; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
        <path d="M8 20v8M16 13v22M24 7v34M32 15v18M40 20v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>MyRadio</h1>
    <div class="subtitle">मेरे पसंदीदा गाने</div>
    <div class="tagline">संगीत का सच्चा आनंद</div>
  

<div style="margin-top:28px">
  <div style="display:flex;align-items:center;justify-content:center;gap:24px">
    <button id="playPause" type="button" aria-label="Play or pause"
      style="width:54px;height:54px;border:0;border-radius:50%;background:#a18bff;color:#101626;font-size:22px;cursor:pointer">
      ▶
    </button>

    <button id="skipButton" type="button"
      style="padding:12px 24px;border:0;border-radius:24px;background:#dce5ff;color:#172554;font-size:16px;cursor:pointer">
      अगला ⏭
    </button>
  </div>

  <div style="display:flex;align-items:center;gap:10px;margin-top:22px">
    <span id="currentTime" style="font-size:12px;color:#c8d2f0">0:00</span>
    <input id="progress" type="range" min="0" max="100" value="0"
      aria-label="Song progress" style="flex:1;min-width:0;cursor:pointer">
    <span id="duration" style="font-size:12px;color:#c8d2f0">0:00</span>
  </div>

  <p id="songTitle" style="color:#c8d2f0;margin-top:16px;font-weight:650;line-height:1.6">
    गाने लोड हो रहे हैं…
  </p>

  <audio id="player" preload="none"></audio>
</div>

  
  </main>
  
<script>
const API = "https://myradio-service.vivek-thakar-nsk.workers.dev";
const player = document.getElementById("player");
const songTitle = document.getElementById("songTitle");

let songs = [];
let remaining = [];
let currentSong = null;
let starting = false;

function shuffleSongs(list) {
  const result = [...list];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

async function startRadio() {
  if (starting) return;
  starting = true;

  if (!songs.length) {
    songTitle.textContent = "गाने लोड हो रहे हैं…";
    try {
      const response = await fetch(`${API}/api/files`);
      const data = await response.json();

      if (!response.ok || !data.success || !data.items) {
        throw new Error("Playlist could not be loaded");
      }

      songs = data.items.filter(song =>
        song.type === "file" &&
        (song.extension || song.name.split(".").pop())
          .toLowerCase() === "mp3"
      );

      if (!songs.length) throw new Error("No MP3 files found");
      remaining = shuffleSongs(songs);
    } catch (error) {
      console.error("Playlist error:", error);
      songTitle.textContent = "गाने लोड नहीं हुए। पेज फिर खोलें।";
      starting = false;
      return;
    }
  }

  playNext();
}

function playNext() {
  if (!remaining.length) {
    remaining = shuffleSongs(songs);
  }

  currentSong = remaining.pop();
  songTitle.textContent = currentSong.name.replace(/\.mp3$/i, "");
  
  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: currentSong.name.replace(/\.mp3$/i, ""),
      artist: "MyRadio",
      album: "मेरे पसंदीदा गाने"
    });
  }

  player.src = `${API}/api/audio?id=${encodeURIComponent(currentSong.id)}`;
  player.load();

  player.play().then(() => {
    starting = false;
  }).catch(error => {
    console.error("Playback error:", error);
    songTitle.textContent = currentSong.name.replace(/\.mp3$/i, "");
    starting = false;
  });
}

player.addEventListener("ended", playNext);
  
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => {
    player.play().catch(error => console.error(error));
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    player.pause();
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (songs.length) {
      player.pause();
      playNext();
    }
  });
}

const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${minutes}:${String(secs).padStart(2, "0")}`;
}

playPause.addEventListener("click", async () => {
  if (player.paused) {
    if (!player.src || player.readyState === 0) {
      await startRadio();
    } else {
      try {
        await player.play();
      } catch (error) {
        console.error("Play error:", error);
      }
    }
  } else {
    player.pause();
  }
});

player.addEventListener("play", () => {
  playPause.textContent = "Ⅱ";
});

player.addEventListener("pause", () => {
  playPause.textContent = "▶";
});

player.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(player.duration);
});

player.addEventListener("timeupdate", () => {
  currentTime.textContent = formatTime(player.currentTime);
  if (Number.isFinite(player.duration) && player.duration > 0) {
    progress.value = (player.currentTime / player.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(player.duration) && player.duration > 0) {
    player.currentTime = (Number(progress.value) / 100) * player.duration;
  }
});

document.getElementById("skipButton").addEventListener("click", () => {
  if (songs.length) {
    player.pause();
    playNext();
  }
});


player.addEventListener("error", () => {
  console.error("Audio element error:", player.error);
  songTitle.textContent = "गाना चलाने में समस्या हुई।";
  starting = false;
});

player.addEventListener("play", () => {
  starting = false;
});

startRadio();
</script>

</body>
</html>
