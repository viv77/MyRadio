<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>MyRadio</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#151c2e; --text:#f5f7fb; --muted:#c8d2f0; }
    * { box-sizing: border-box; }
    body { position:fixed; inset:0; width:100%; height:100svh; min-height:100svh; margin:0; display:grid; place-items:center; overflow:hidden; overscroll-behavior:none; padding:max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); font-family:system-ui,-apple-system,"Noto Sans Devanagari","Mangal",sans-serif; color:var(--text); background:radial-gradient(ellipse at top,#202a49 0%,var(--bg) 58%); }
    main { position:relative; width:min(100%,520px); max-height:calc(100svh - 16px); text-align:center; background:rgba(21,28,46,.92); border:1px solid #2b3650; border-radius:28px; padding:36px 28px 34px; box-shadow:0 24px 70px #0005; }
    .mark { width:48px; height:48px; margin:0 auto 8px; display:grid; place-items:center; border-radius:24px; background:linear-gradient(135deg,#8b9cff,#b48bff); color:#10162a; }
    .mark-wrap { position:relative; width:100%; height:48px; margin:0 auto 8px; }
    .mark-wrap .mark { margin:0 auto; }
    .mark-wrap #settingsButton { position:absolute; left:calc(50% + 36px); top:9px; }
    .brand-row { position:relative; display:flex; align-items:center; justify-content:center; width:100%; min-height:48px; }
    .brand-actions { position:absolute; left:calc((100% - 288px)/2 + 8px); top:0; width:38px; height:215px; z-index:5; pointer-events:none; }
    .brand-actions > button { pointer-events:auto; }
    .brand-actions > button { position:absolute; left:0; }
    #updateButton { top:5px; }
    .update-count { position:absolute; top:45px; left:0; width:38px; }
    .shuffle-action { top:91px; }
    .auto-skip-action { top:177px; background:#a18bff; color:#101626; border-color:#a18bff; font-size:17px; font-weight:850; padding:0; }
    .auto-skip-action:hover { background:#b7a7ff; }
    .auto-skip-popup { position:absolute; left:calc((100% - 288px)/2 - 8px); top:calc(50% + 74px); z-index:20; width:190px; padding:10px; border:1px solid #536080; border-radius:15px; background:#202a43; box-shadow:0 12px 32px #0009; display:none; }
    .auto-skip-popup.open { display:block; }
    .auto-skip-options { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; }
    .auto-skip-option { min-height:34px; border:1px solid #7180a2; border-radius:9px; background:#34415f; color:#fff; font:700 13px system-ui,sans-serif; cursor:pointer; }
    .auto-skip-option.selected { background:#fff; color:#172554; border-color:#fff; }
    .auto-skip-option:focus-visible { outline:2px solid #a18bff; outline-offset:2px; }
    .play-mode-toggle { display:flex; justify-content:center; align-items:center; gap:7px; margin:0 auto 8px; }
    .play-mode-button { min-width:68px; height:30px; padding:0 15px; border:1px solid #7180a2; border-radius:999px; background:#26324d; color:#dce5ff; font:750 12px system-ui,sans-serif; letter-spacing:.07em; cursor:pointer; transition:background .15s ease,border-color .15s ease,color .15s ease; }
    .play-mode-button.active { background:#a18bff; border-color:#a18bff; color:#101626; box-shadow:0 0 0 2px #a18bff30; }
    #playFavouritesButton.active { background:#ef3340; border-color:#ef3340; color:#ffffff; box-shadow:0 0 0 2px #ef334033; }
    .play-mode-button:disabled { opacity:.5; cursor:not-allowed; }
    .play-mode-button:focus-visible { outline:2px solid #a18bff; outline-offset:2px; }
    .brand-title { min-width:0; display:flex; align-items:center; justify-content:center; }
    .brand-title h1 { transform:translateY(4px); }
    h1 { margin:0; font-size:clamp(2rem,7vw,2.7rem); letter-spacing:-.04em; white-space:nowrap; }
    .header-action { width:38px; height:38px; padding:7px; border:1px solid #dce5ff; border-radius:50%; background:#ffffff; color:#172554; display:grid; place-items:center; cursor:pointer; flex:0 0 auto; }
    .header-action svg { width:21px; height:21px; display:block; }
    .header-action:hover { background:#e8edff; }
    .header-action:focus-visible { outline:2px solid #a18bff; outline-offset:2px; }
    .header-action:disabled { opacity:.42; cursor:not-allowed; }
    .header-action.is-updating:disabled { opacity:.75; cursor:wait; }
    .shuffle-action.is-shuffling svg { animation:shuffleTurn .55s ease-in-out; }
    .shuffle-action.is-shuffling { background:#cfd8ff; box-shadow:0 0 0 3px #a18bff55; }
    @keyframes shuffleTurn { from { transform:rotate(0deg) scale(1); } to { transform:rotate(360deg) scale(1.08); } }
    @media (max-width:420px) {
      .brand-actions { left:calc((100% - 288px)/2 + 8px); width:36px; height:216px; }
      .header-action { width:36px; height:36px; }
      #updateButton { top:6px; }
      .update-count { top:44px; width:36px; }
      .shuffle-action { top:93px; }
      .auto-skip-action { top:180px; font-size:17px; }
      .auto-skip-popup { left:calc((100% - 288px)/2 - 6px); top:calc(50% + 75px); width:184px; }
    }
    .update-dots { display:none; gap:3px; align-items:center; justify-content:center; }
    .update-count { display:none; min-width:20px; color:#ffffff; font-size:13px; line-height:1; font-weight:700; text-align:center; font-variant-numeric:tabular-nums; }
    .update-count.visible { display:block; }
    #updateButton.is-updating svg { display:none; }
    #updateButton.is-updating .update-dots { display:flex; }
    .update-dots i { width:4px; height:4px; border-radius:50%; background:#172554; animation:updateDot .8s infinite ease-in-out; }
    .update-dots i:nth-child(2) { animation-delay:.12s; }
    .update-dots i:nth-child(3) { animation-delay:.24s; }
    .update-dots i:nth-child(4) { animation-delay:.36s; }
    .update-dots i:nth-child(5) { animation-delay:.48s; }
    @keyframes updateDot { 0%,60%,100% { opacity:.3; transform:translateY(0); } 30% { opacity:1; transform:translateY(-3px); } }
    .subtitle { margin:18px 0 7px; font-size:1.28rem; font-weight:700; line-height:1.7; }
    .tagline { margin:0 0 34px; color:var(--muted); font-size:1rem; line-height:1.7; }
    .wait { margin:0; color:#fff; font-size:1.08rem; font-weight:650; line-height:1.7; }
    .pulse { display:inline-block; width:8px; height:8px; margin-right:9px; border-radius:50%; background:#a18bff; vertical-align:middle; }
    .volume-control { position:absolute; right:calc(50% - 129px); top:137px; height:210px; width:28px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; z-index:2; }
    #volume { -webkit-appearance:none; appearance:none; writing-mode:vertical-lr; direction:rtl; width:24px; height:174px; margin:0; padding:0; cursor:pointer; background:transparent; touch-action:none; }
    #volume::-webkit-slider-runnable-track { width:9px; height:174px; border-radius:99px; background:linear-gradient(to top,#ffffff 0%,#ffffff var(--volume-fill,80%),#8793ad var(--volume-fill,80%),#8793ad 100%); border:1px solid #dce5ff; }
    #volume::-webkit-slider-thumb { -webkit-appearance:none; width:26px; height:26px; margin-left:-8px; border-radius:50%; background:#ffffff; border:2px solid #dce5ff; box-shadow:0 1px 5px #0008; }
    #volume::-moz-range-track { width:9px; height:174px; border-radius:99px; background:#8793ad; border:1px solid #dce5ff; }
    #volume::-moz-range-progress { width:9px; border-radius:99px; background:#ffffff; }
    #volume::-moz-range-thumb { width:24px; height:24px; border-radius:50%; background:#ffffff; border:2px solid #dce5ff; box-shadow:0 1px 5px #0008; }
    .volume-icon { width:24px; height:24px; color:#ffffff; display:block; }
    @media (max-width:420px) {
      .volume-control { right:calc(50% - 129px); top:132px; height:210px; }
      #volume { height:174px; }
      #volume::-webkit-slider-runnable-track { height:174px; }
      #volume::-moz-range-track { height:174px; }
    }
    @media (max-width:420px) { main { padding:30px 20px; } .subtitle { font-size:1.15rem; } .play-mode-button { min-width:64px; height:29px; } }
    #settingsButton { width:30px; height:30px; flex:0 0 30px; border:1px solid #dce5ff; border-radius:50%; background:#ffffff; color:#172554; display:grid; place-items:center; cursor:pointer; font-size:16px; line-height:1; }
    #settingsButton:focus-visible, #favouriteButton:focus-visible, .settings-action:focus-visible { outline:2px solid #a18bff; outline-offset:2px; }
    .song-title-row { display:grid; grid-template-columns:38px minmax(0,1fr) 38px; align-items:center; gap:7px; margin-top:16px; }
    #songTitle { min-width:0; margin:0 !important; overflow-wrap:anywhere; }
    #favouriteButton { width:42px; height:42px; border:0; border-radius:50%; background:#26324d; color:#ff5364; font-size:32px; line-height:1; cursor:pointer; display:grid; place-items:center; }
    #favouriteButton.is-favourite { color:#ff3347; background:#4a202d; }
    .settings-backdrop { position:fixed; inset:0; z-index:1000; display:none; place-items:center; padding:16px; background:#050914c9; }
    .settings-backdrop.open { display:grid; }
    .settings-panel { width:min(100%,360px); max-height:min(88svh,620px); overflow:auto; padding:20px; border:1px solid #536080; border-radius:20px; background:#18223a; box-shadow:0 18px 55px #000b; text-align:left; }
    .settings-panel { position:relative; padding-top:24px; }
    .settings-panel h2 { margin:0 0 14px; }
    .settings-close { position:absolute; top:9px; right:11px; width:30px; height:30px; border:0; border-radius:50%; background:transparent; color:#dce5ff; font-size:25px; line-height:1; cursor:pointer; }
    .settings-status[hidden] { display:none !important; }
    .settings-panel h2 { margin:0 0 5px; font-size:1.25rem; text-align:center; }
    .settings-description { margin:0 0 15px; color:#c8d2f0; font-size:.86rem; text-align:center; }
    .settings-status { min-height:20px; margin:10px 0; color:#c8d2f0; font-size:.82rem; text-align:center; overflow-wrap:anywhere; }
    .settings-action { width:100%; min-height:42px; margin-top:9px; padding:9px 12px; border:1px solid #7180a2; border-radius:11px; background:#34415f; color:#fff; font:650 14px system-ui,sans-serif; cursor:pointer; }
    .settings-action.primary { background:#a18bff; border-color:#a18bff; color:#101626; }
    .settings-action:disabled { opacity:.5; cursor:not-allowed; }
    .settings-note { margin:12px 0 0; color:#aebbd8; font-size:.75rem; line-height:1.45; text-align:center; }
  </style>
</head>
<body>
  <main>
    <div class="mark-wrap">
      <div class="mark" aria-hidden="true">
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none">
          <path d="M8 20v8M16 13v22M24 7v34M32 15v18M40 20v8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
        </svg>

    </div>
    <div class="play-mode-toggle" role="group" aria-label="Playback collection">

    <div class="brand-row">
      <div class="brand-actions">

            <path d="M7.5 20V4"/><path d="m4.5 7 3-3 3 3"/>
            <path d="M16.5 4v16"/><path d="m13.5 17 3 3 3-3"/>
          </svg>
          <span class="update-dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <span id="updateCount" class="update-count" aria-live="polite"></span>
        <button id="shuffleButton" class="header-action shuffle-action" type="button" aria-label="Reshuffle remaining songs" title="Reshuffle remaining songs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m16 3 4 4-4 4"/><path d="M4 17h2.5a5 5 0 0 0 4-2l3-4a5 5 0 0 1 4-2H20"/>
        <path d="m16 14 4 4-4 4"/><path d="M4 7h2.5a5 5 0 0 1 3.5 1.5"/>
      </svg>
        </button>
        <button id="autoSkipButton" class="header-action auto-skip-action" type="button" aria-label="Auto-Skip: Full song" title="Auto-Skip: Full song" aria-haspopup="true" aria-expanded="false">F</button>
      </div>
      <div class="brand-title"><h1>MyRadio</h1></div>
    </div>
    <div id="autoSkipPopup" class="auto-skip-popup" role="dialog" aria-label="Choose Auto-Skip setting">
      <div class="auto-skip-options">
        <button class="auto-skip-option selected" type="button" data-value="full">F</button>
        <button class="auto-skip-option" type="button" data-value="half">½</button>

        <button class="auto-skip-option" type="button" data-value="2">2m</button>
        <button class="auto-skip-option" type="button" data-value="3">3m</button>
        <button class="auto-skip-option" type="button" data-value="4">4m</button>

    <div id="settingsBackdrop" class="settings-backdrop" role="dialog" aria-modal="true" aria-labelledby="settingsHeading">
      <div class="settings-panel">

        <h2 id="settingsHeading">Favourites</h2>
        <button id="backupFavouritesButton" class="settings-action" type="button">Backup</button>
        <button id="restoreFavouritesButton" class="settings-action" type="button">Restore</button>
        <input id="restoreFavouritesFile" type="file" accept="application/json,.json" hidden>
        <div id="favouritesSettingsStatus" class="settings-status" aria-live="polite" hidden></div>
      </div>
    </div>
    <div class="subtitle">मेरे पसंदीदा गाने</div>
    <div class="tagline">संगीत का सच्चा आनंद</div>
    <div class="volume-control" aria-label="Volume control">
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      <svg class="volume-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4V5Z"/>
        <path d="M15.5 8.5a5 5 0 0 1 0 7"/>
        <path d="M18.5 5.5a9 9 0 0 1 0 13"/>
      </svg>
    </div>
  

<div style="margin-top:28px">
  <div style="display:flex;align-items:center;justify-content:center;gap:24px">

   
<button id="previousButton" type="button" aria-label="Previous song"
  style="width:54px;height:54px;flex-shrink:0;border:0;border-radius:50%;background:#dce5ff;color:#172554;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center">
  ⏮
</button>

    <button id="playPause" type="button" aria-label="Play or pause"
      style="width:54px;height:54px;flex-shrink:0;border:0;border-radius:50%;background:#a18bff;color:#101626;font-size:22px;font-weight:bold;cursor:pointer;display:flex;align-items:center;justify-content:center">
      ▶
    </button>

    <button id="skipButton" type="button" aria-label="Next song"
      style="width:54px;height:54px;flex-shrink:0;border:0;border-radius:50%;background:#dce5ff;color:#172554;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center">
      ⏭
    </button>

    <button id="exitButton" type="button" aria-label="Exit"
      style="position:relative;z-index:50;pointer-events:auto;width:54px;height:54px;flex-shrink:0;border:0;border-radius:50%;background:#dce5ff;color:#172554;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center">
      ✕
    </button>

  </div>
</div>
  <div style="display:flex;align-items:center;gap:10px;margin-top:22px">
    <span id="currentTime" style="font-size:12px;color:#c8d2f0">0:00</span>
    <input id="progress" type="range" min="0" max="100" value="0"
      aria-label="Song progress" style="flex:1;min-width:0;cursor:pointer">
    <span id="duration" style="font-size:12px;color:#c8d2f0">0:00</span>
  </div>

  <div class="song-title-row">
    <span aria-hidden="true"></span>
    <p id="songTitle" style="color:#c8d2f0;font-weight:650;line-height:1.6">
      गाने लोड हो रहे हैं…
    </p>
    <button id="favouriteButton" type="button" aria-label="Add to Favourites" title="Add to Favourites" aria-pressed="false">♡</button>

  <audio id="player" preload="none"></audio>
</main>
  
<script>
const API = "https://myradio-service.vivek-thakar-nsk.workers.dev";
const accessToken = new URLSearchParams(window.location.search).get("access");
  // Persistent browser installation ID
let deviceId = localStorage.getItem("myradio_device_id");

if (!deviceId) {
  deviceId = crypto.randomUUID();
  localStorage.setItem("myradio_device_id", deviceId);
}

const deviceShortId = deviceId.replace(/-/g, "").slice(0, 6).toUpperCase();

// Identify device model where available
async function getDeviceName() {
  if (navigator.userAgentData) {
    try {
      const info = await navigator.userAgentData.getHighEntropyValues(
        ["model", "platform"]
      );

      if (info.model) return info.model;
      if (info.platform === "Android") return "Android device";
      if (info.platform === "Windows") return "Windows PC";
    } catch (error) {}
  }

  const ua = navigator.userAgent;

  if (/Android/i.test(ua)) return "Android device";
  if (/iPhone/i.test(ua)) return "iPhone";
  if (/iPad/i.test(ua)) return "iPad";
  if (/Windows/i.test(ua)) return "Windows PC";
  if (/Macintosh|Mac OS/i.test(ua)) return "Mac";

  return "Unknown device";
}
  const player = document.getElementById("player");

// Keep the side controls aligned to the actual player geometry on both laptop and mobile.
function alignSideControls() {
  const main = document.querySelector("main");
  const mark = document.querySelector(".mark");
  const brandRow = document.querySelector(".brand-row");
  const brandActions = document.querySelector(".brand-actions");
  const volumeControl = document.querySelector(".volume-control");
  const volumeSlider = document.getElementById("volume");
  const volumeIcon = document.querySelector(".volume-icon");
  const updateButton = document.getElementById("updateButton");
  const updateCount = document.getElementById("updateCount");
  const shuffleButton = document.getElementById("shuffleButton");
  const autoSkipButton = document.getElementById("autoSkipButton");
  const exitButton = document.getElementById("exitButton");
  if (!main || !mark || !brandRow || !brandActions || !volumeControl ||
      !volumeSlider || !volumeIcon || !updateButton || !updateCount || !shuffleButton ||
      !autoSkipButton || !exitButton) return;

  const mainRect = main.getBoundingClientRect();
  const markRect = mark.getBoundingClientRect();
  const brandRect = brandRow.getBoundingClientRect();
  const exitRect = exitButton.getBoundingClientRect();

  // Slider begins at the vertical midpoint of the MyRadio mark.
  const sliderTop = markRect.top + markRect.height / 2;
  // Keep the volume icon safely above the Exit/Close button.
  const iconBottom = exitRect.top - 12;
  const iconHeight = 24;
  const gap = 9;
  const sliderHeight = Math.max(90, iconBottom - sliderTop - iconHeight - gap);
  const controlHeight = sliderHeight + gap + iconHeight;

  volumeControl.style.top = `${sliderTop - mainRect.top}px`;
  volumeControl.style.height = `${controlHeight}px`;
  volumeSlider.style.height = `${sliderHeight}px`;
  volumeSlider.style.flex = "0 0 auto";
  volumeSlider.style.setProperty("--slider-track-height", `${sliderHeight}px`);

  // Update top aligns with the slider's top.
  const updateTop = sliderTop - brandRect.top;
  // Timer bottom aligns with the bottom of the volume slider,
  // leaving the volume icon below it.
  const sliderBottom = sliderTop + sliderHeight;
  const timerTop = sliderBottom - autoSkipButton.offsetHeight - brandRect.top;
  const buttonSize = updateButton.offsetHeight;
  updateButton.style.top = `${updateTop}px`;
  // Keep the result count directly below Update, never over the Reshuffle button.
  updateCount.style.top = `${updateTop + buttonSize + 4}px`;
  autoSkipButton.style.top = `${timerTop}px`;
  // Reshuffle centre is exactly halfway between Update and Timer centres.
  const shuffleTop = ((updateTop + buttonSize / 2) + (timerTop + buttonSize / 2)) / 2 - shuffleButton.offsetHeight / 2;
  shuffleButton.style.top = `${shuffleTop}px`;
}

window.addEventListener("resize", alignSideControls, { passive: true });
window.addEventListener("orientationchange", () => requestAnimationFrame(alignSideControls), { passive: true });
requestAnimationFrame(() => requestAnimationFrame(alignSideControls));

// Auto-Skip preference persists on this device.
const autoSkipButton = document.getElementById("autoSkipButton");
const autoSkipPopup = document.getElementById("autoSkipPopup");
const autoSkipOptions = [...document.querySelectorAll(".auto-skip-option")];
const autoSkipLabels = { full: "F", half: "½", "1": "1m", "2": "2m", "3": "3m", "4": "4m" };
let autoSkipChoice = "full";
let autoSkipTriggered = false;
let deferAutoSkipForSongId = null;
try {
  const savedAutoSkip = localStorage.getItem("myradio_auto_skip");
  if (savedAutoSkip && Object.prototype.hasOwnProperty.call(autoSkipLabels, savedAutoSkip)) {
    autoSkipChoice = savedAutoSkip;
  }
} catch (error) {}

function refreshAutoSkipButton() {
  autoSkipButton.textContent = autoSkipLabels[autoSkipChoice];
  autoSkipButton.setAttribute("aria-label", `Auto-Skip: ${autoSkipChoice === "full" ? "Full song" : autoSkipChoice === "half" ? "Halfway" : autoSkipChoice + " minutes"}`);
  autoSkipButton.title = autoSkipButton.getAttribute("aria-label");
  autoSkipOptions.forEach(option => {
    const selected = option.dataset.value === autoSkipChoice;
    option.classList.toggle("selected", selected);
    option.setAttribute("aria-pressed", String(selected));
  });
}
refreshAutoSkipButton();

function autoSkipThreshold() {
  if (autoSkipChoice === "full") return Infinity;
  if (autoSkipChoice === "half") {
    return Number.isFinite(player.duration) && player.duration > 0 ? player.duration / 2 : Infinity;
  }
  return Number(autoSkipChoice) * 60;
}

autoSkipButton.addEventListener("click", () => {
  const opening = !autoSkipPopup.classList.contains("open");
  autoSkipPopup.classList.toggle("open", opening);
  autoSkipButton.setAttribute("aria-expanded", String(opening));
});

autoSkipOptions.forEach(option => {
  option.addEventListener("click", () => {
    const nextChoice = option.dataset.value;
    const threshold = nextChoice === "full" ? Infinity :
      nextChoice === "half" ? (Number.isFinite(player.duration) && player.duration > 0 ? player.duration / 2 : Infinity) :
      Number(nextChoice) * 60;

    // If the current song has already passed the newly selected mark,
    // keep it playing and begin this setting with the next song.
    if (currentSong && Number.isFinite(threshold) && player.currentTime >= threshold) {
      deferAutoSkipForSongId = String(currentSong.id);
    } else {
      deferAutoSkipForSongId = null;
    }

    autoSkipChoice = nextChoice;
    autoSkipTriggered = false;
    try { localStorage.setItem("myradio_auto_skip", autoSkipChoice); } catch (error) {}
    refreshAutoSkipButton();
    autoSkipPopup.classList.remove("open");
    autoSkipButton.setAttribute("aria-expanded", "false");
  });
});

let songs = [];
let remaining = [];
let currentSong = null;
  let songHistory = [];
let historyIndex = -1;
let starting = false;
let playbackRequestId = 0;
const queueKey = "myradio_queue_" + (accessToken || "no-token");
const catalogueKey = "myradio_catalogue_" + (accessToken || "no-token");
const updateBaselineKey = "myradio_update_baseline_" + (accessToken || "no-token");

// Favourites are device-local. IndexedDB is the primary store; Chrome's
// Persistent Storage request protects it from automatic eviction where granted.
const favouritesDbName = "MyRadio_Favourites";
const favouritesStoreName = "collections";
const favouritesRecordKey = "main";
const favouritesFallbackKey = "myradio_favourites_fallback_v1";
const favouritesBackupVersion = 1;
let favouriteSongs = [];
let favouriteDb = null;
let favouriteStorageReady = false;
let favouriteStorageMode = "loading";
let favouritePersistenceGranted = false;
let playbackMode = "all";
let favouriteRemaining = [];
let favouriteHistory = [];
let favouriteHistoryIndex = -1;
let favouritesReadyPromise = null;

function openFavouritesDatabase() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) {
      reject(new Error("IndexedDB is unavailable"));
      return;
    }
    const request = indexedDB.open(favouritesDbName, 1);
    request.onupgradeneeded = () => {
      const db = request.result;
      if (!db.objectStoreNames.contains(favouritesStoreName)) {
        db.createObjectStore(favouritesStoreName);
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error || new Error("Could not open Favourite storage"));
    request.onblocked = () => reject(new Error("Favourite storage is busy in another tab"));
  });
}

function readFavouritesFromDatabase(db) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(favouritesStoreName, "readonly");
    const request = transaction.objectStore(favouritesStoreName).get(favouritesRecordKey);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error || new Error("Could not read Favourites"));
  });
}

function writeFavouritesToDatabase(db, record) {
  return new Promise((resolve, reject) => {
    const transaction = db.transaction(favouritesStoreName, "readwrite");
    transaction.objectStore(favouritesStoreName).put(record, favouritesRecordKey);
    transaction.oncomplete = () => resolve();
    transaction.onerror = () => reject(transaction.error || new Error("Could not save Favourites"));
    transaction.onabort = () => reject(transaction.error || new Error("Favourite save was interrupted"));
  });
}

function cleanFavouriteEntries(entries) {
  if (!Array.isArray(entries)) return [];
  const seen = new Set();
  const cleaned = [];
  for (const entry of entries) {
    if (!entry || entry.id == null) continue;
    const id = String(entry.id);
    if (!id || seen.has(id)) continue;
    seen.add(id);
    cleaned.push({ id, name: String(entry.name || id) });
  }
  return cleaned;
}

function setFavouriteSettingsStatus(message) {
  const status = document.getElementById("favouritesSettingsStatus");
  if (status) status.textContent = message;
}

async function initFavouriteStorage() {
  if (favouritesReadyPromise) return favouritesReadyPromise;
  favouritesReadyPromise = (async () => {
    try {
      favouriteDb = await openFavouritesDatabase();
      const savedRecord = await readFavouritesFromDatabase(favouriteDb);
      favouriteSongs = cleanFavouriteEntries(savedRecord && savedRecord.favourites);
      favouriteStorageMode = "indexeddb";
      favouriteStorageReady = true;

      // Migrate the early localStorage fallback once, if IndexedDB is empty.
      if (!savedRecord) {
        try {
          const fallback = JSON.parse(localStorage.getItem(favouritesFallbackKey) || "null");
          if (fallback && Array.isArray(fallback.favourites)) {
            favouriteSongs = cleanFavouriteEntries(fallback.favourites);
            await persistFavourites();
          }
        } catch (migrationError) {
          console.warn("Older Favourite data could not be migrated:", migrationError);
        }
      }
    } catch (error) {
      console.warn("IndexedDB unavailable; using local browser storage fallback:", error);
      favouriteStorageMode = "localstorage";
      try {
        const fallback = JSON.parse(localStorage.getItem(favouritesFallbackKey) || "null");
        favouriteSongs = cleanFavouriteEntries(fallback && fallback.favourites);
      } catch (readError) {
        favouriteSongs = [];
      }
      favouriteStorageReady = true;
    }

    // This request is automatic and normally does not show a permission prompt.
    try {
      if (navigator.storage && navigator.storage.persist) {
        favouritePersistenceGranted = await navigator.storage.persist();
      }
    } catch (error) {
      favouritePersistenceGranted = false;
    }

    refreshFavouriteButton();
    refreshFavouriteSettings();
    return true;
  })();
  return favouritesReadyPromise;
}

async function persistFavourites() {
  const record = {
    version: favouritesBackupVersion,
    updatedAt: new Date().toISOString(),
    favourites: cleanFavouriteEntries(favouriteSongs)
  };

  if (favouriteStorageMode === "indexeddb" && favouriteDb) {
    await writeFavouritesToDatabase(favouriteDb, record);
  } else {
    localStorage.setItem(favouritesFallbackKey, JSON.stringify(record));
  }
  refreshFavouriteSettings();
}

function refreshFavouriteButton() {
  const button = document.getElementById("favouriteButton");
  if (!button) return;
  const currentId = currentSong && currentSong.id != null ? String(currentSong.id) : null;
  const isFavourite = currentId !== null && favouriteSongs.some(item => item.id === currentId);
  button.textContent = isFavourite ? "♥" : "♡";
  button.classList.toggle("is-favourite", isFavourite);
  button.setAttribute("aria-pressed", String(isFavourite));
  button.setAttribute("aria-label", isFavourite ? "Remove from Favourites" : "Add to Favourites");
  button.title = button.getAttribute("aria-label");
  button.disabled = !currentSong || !favouriteStorageReady;
}

function refreshPlaybackModeButtons() {
  const allButton = document.getElementById("playAllSongsButton");
  const favButton = document.getElementById("playFavouritesButton");
  if (!allButton || !favButton) return;
  const isFavourites = playbackMode === "favourites";
  allButton.classList.toggle("active", !isFavourites);
  favButton.classList.toggle("active", isFavourites);
  allButton.setAttribute("aria-pressed", String(!isFavourites));
  favButton.setAttribute("aria-pressed", String(isFavourites));
  favButton.disabled = !favouriteStorageReady || favouriteSongs.length === 0;
}

function refreshFavouriteSettings() {
  refreshPlaybackModeButtons();
  const count = favouriteSongs.length;
  setFavouriteSettingsStatus(`${count} Favourite song${count === 1 ? "" : "s"}`);
}

async function toggleCurrentFavourite() {
  if (!currentSong || currentSong.id == null || !favouriteStorageReady) return;
  const id = String(currentSong.id);
  const index = favouriteSongs.findIndex(item => item.id === id);
  if (index >= 0) {
    favouriteSongs.splice(index, 1);
    if (playbackMode === "favourites") {
      favouriteRemaining = favouriteRemaining.filter(song => String(song.id) !== id);
    }
  } else {
    favouriteSongs.push({ id, name: currentSong.name || id });
  }
  refreshFavouriteButton();
  refreshFavouriteSettings();
  try {
    await persistFavourites();
    setFavouriteSettingsStatus(`${favouriteSongs.length} Favourite song${favouriteSongs.length === 1 ? "" : "s"}. Saved on this device.`);
  } catch (error) {
    console.error("Favourite could not be saved:", error);
    setFavouriteSettingsStatus("Could not save Favourites. Please try again.");
  }
}

function addToFavouriteHistory(song) {
  if (favouriteHistoryIndex < favouriteHistory.length - 1) {
    favouriteHistory = favouriteHistory.slice(0, favouriteHistoryIndex + 1);
  }
  favouriteHistory.push(song);
  if (favouriteHistory.length > 100) favouriteHistory.splice(0, favouriteHistory.length - 100);
  favouriteHistoryIndex = favouriteHistory.length - 1;
}

function getAvailableFavouriteSongs() {
  const songMap = new Map(songs.map(song => [String(song.id), song]));
  return favouriteSongs.map(item => songMap.get(item.id)).filter(Boolean);
}

function playFavourites() {
  if (!favouriteStorageReady || !favouriteSongs.length) {
    setFavouriteSettingsStatus("There are no saved Favourite songs yet.");
    return;
  }
  const available = getAvailableFavouriteSongs();
  if (!available.length) {
    setFavouriteSettingsStatus("None of the saved Favourite songs are currently in the Box catalogue. Use Update and try again.");
    return;
  }
  playbackMode = "favourites";
  refreshPlaybackModeButtons();
  favouriteRemaining = shuffleSongs(available);
  favouriteHistory = [];
  favouriteHistoryIndex = -1;
  const firstSong = favouriteRemaining.pop();
  if (!firstSong) return;
  currentSong = firstSong;
  addToFavouriteHistory(firstSong);
  closeSettings();
  playSong(firstSong);
}

const favouritesBackupHandleKey = "backupFileHandle";
const favouritesRestoreHandleKey = "restoreFileHandle";

async function getRememberedFileHandle(key) {
  if (!favouriteDb) return null;
  return new Promise((resolve, reject) => {
    const tx = favouriteDb.transaction(favouritesStoreName, "readonly");
    const request = tx.objectStore(favouritesStoreName).get(key);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error || new Error("Could not read saved file permission"));
  });
}

async function saveRememberedFileHandle(key, handle) {
  if (!favouriteDb) return;
  return new Promise((resolve, reject) => {
    const tx = favouriteDb.transaction(favouritesStoreName, "readwrite");
    tx.objectStore(favouritesStoreName).put(handle, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error || new Error("Could not remember the selected file"));
  });
}

async function ensureFileHandlePermission(handle, mode) {
  if (!handle) return false;
  let permission = await handle.queryPermission({ mode });
  if (permission !== "granted") {
    permission = await handle.requestPermission({ mode });
  }
  return permission === "granted";
}

function buildFavouritesBackupBlob() {
  const payload = {
    app: "MyRadio",
    type: "favourites-backup",
    version: favouritesBackupVersion,
    exportedAt: new Date().toISOString(),
    favourites: cleanFavouriteEntries(favouriteSongs)
  };
  return new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
}

async function exportFavouritesBackup() {
  if (!favouriteStorageReady) return;
  const blob = buildFavouritesBackupBlob();

  // When the browser supports the File System Access API, remember the chosen
  // backup file and overwrite that same file on later backups without a
  // repeated "Download again?" prompt.
  if (window.showSaveFilePicker) {
    try {
      let handle = await getRememberedFileHandle(favouritesBackupHandleKey);
      if (handle && !(await ensureFileHandlePermission(handle, "readwrite"))) handle = null;

      if (!handle) {
        handle = await window.showSaveFilePicker({
          suggestedName: "MyRadio_Favourites.json",
          types: [{ description: "MyRadio Favourites backup", accept: { "application/json": [".json"] } }]
        });
        await saveRememberedFileHandle(favouritesBackupHandleKey, handle);
      }

      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
      return;
    } catch (error) {
      if (error && error.name === "AbortError") return;
      console.warn("Remembered backup file unavailable; using browser download fallback.", error);
    }
  }

  // Compatibility fallback for browsers without persistent file handles.
  // Browser download managers may still ask whether to download the same name again.
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "MyRadio_Favourites.json";
  document.body.appendChild(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(url), 1500);
}

async function readAndImportFavouritesFile(file) {
  if (!file) return;
  const parsed = JSON.parse(await file.text());
  if (!parsed || parsed.app !== "MyRadio" || parsed.type !== "favourites-backup" || parsed.version !== favouritesBackupVersion || !Array.isArray(parsed.favourites)) {
    throw new Error("This is not a supported MyRadio Favourites backup file.");
  }
  const imported = cleanFavouriteEntries(parsed.favourites);
  const confirmed = window.confirm(`Replace the current ${favouriteSongs.length} Favourites with ${imported.length} songs from this backup?`);
  if (!confirmed) return;
  favouriteSongs = imported;
  if (playbackMode === "favourites") {
    playbackMode = "all";
    refreshPlaybackModeButtons();
    favouriteRemaining = [];
    favouriteHistory = [];
    favouriteHistoryIndex = -1;
  }
  await persistFavourites();
  refreshFavouriteButton();
}

async function importFavouritesBackup(file) {
  try {
    await readAndImportFavouritesFile(file);
  } catch (error) {
    console.error("Favourite restore failed:", error);
    window.alert(error.message || "Could not restore this backup file.");
  }
}

async function restoreFavouritesFromRememberedFile() {
  if (!favouriteStorageReady) return;
  if (window.showOpenFilePicker) {
    try {
      let handle = await getRememberedFileHandle(favouritesRestoreHandleKey);
      if (handle && !(await ensureFileHandlePermission(handle, "read"))) handle = null;

      if (!handle) {
        const handles = await window.showOpenFilePicker({
          multiple: false,
          types: [{ description: "MyRadio Favourites backup", accept: { "application/json": [".json"] } }]
        });
        if (!handles || !handles[0]) return;
        handle = handles[0];
        await saveRememberedFileHandle(favouritesRestoreHandleKey, handle);
      }

      const file = await handle.getFile();
      await readAndImportFavouritesFile(file);
      return;
    } catch (error) {
      if (error && error.name === "AbortError") return;
      console.warn("Remembered restore file unavailable; opening file picker fallback.", error);
    }
  }
  // Older/mobile browsers may not support persistent file handles; ask once per restore.
  document.getElementById("restoreFavouritesFile").click();
}

function openSettings() {
  const backdrop = document.getElementById("settingsBackdrop");
  if (backdrop.classList.contains("open")) return;
  backdrop.classList.add("open");

  try {
    history.pushState({ myRadioSettingsOpen: true }, "", location.href);
    settingsHistoryEntryOpen = true;
  } catch (_) {
    settingsHistoryEntryOpen = false;
  }
}

let settingsHistoryEntryOpen = false;

function closeSettings(fromPopState = false) {
  const backdrop = document.getElementById("settingsBackdrop");
  if (!backdrop.classList.contains("open")) return;
  backdrop.classList.remove("open");
  if (!fromPopState && settingsHistoryEntryOpen) {

}

function shuffleSongs(list) {
  const result = [...list];
  for (let i = result.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [result[i], result[j]] = [result[j], result[i]];
  }
  return result;
}

// Keep the in-memory history and its index aligned with the 100-song saved buffer.
function addToSongHistory(song) {
  if (historyIndex < songHistory.length - 1) {
    songHistory = songHistory.slice(0, historyIndex + 1);
  }
  songHistory.push(song);
  if (songHistory.length > 100) {
    const excess = songHistory.length - 100;
    songHistory.splice(0, excess);
  }
  historyIndex = songHistory.length - 1;
}

// IDs played in the active mode up to the current position, plus the current
// song. This keeps a manual reshuffle from bringing recent tracks straight back.
function getRecentPlayedIds(history, index, current) {
  const played = Number.isInteger(index) && index >= 0
    ? history.slice(0, index + 1)
    : [];
  const recent = played.slice(-100);
  const ids = new Set(recent.map(song => String(song.id)));
  if (current && current.id != null) ids.add(String(current.id));
  return ids;
}

function animateShuffleButton() {
  shuffleButton.classList.remove("is-shuffling");
  void shuffleButton.offsetWidth;
  shuffleButton.classList.add("is-shuffling");
  window.setTimeout(() => shuffleButton.classList.remove("is-shuffling"), 650);
}

// Update and Shuffle each have an independent, device-local rolling 24-hour lock.
// The lock survives page reloads and browser restarts.
const actionCooldownMs = 24 * 60 * 60 * 1000;
const updateCooldownKey = "myradio_update_cooldown_" + (accessToken || "no-token");
const shuffleCooldownKey = "myradio_shuffle_cooldown_" + (accessToken || "no-token");
const cooldownTimers = { update: null, shuffle: null };

function cooldownExpiry(action) {
  const key = action === "update" ? updateCooldownKey : shuffleCooldownKey;
  try {
    const pressedAt = Number(localStorage.getItem(key));
    return Number.isFinite(pressedAt) && pressedAt > 0 ? pressedAt + actionCooldownMs : 0;
  } catch (error) {
    return 0;
  }
}

function refreshActionCooldown(action) {
  const button = document.getElementById(action === "update" ? "updateButton" : "shuffleButton");
  if (!button) return;
  if (cooldownTimers[action]) window.clearTimeout(cooldownTimers[action]);
  const expiresAt = cooldownExpiry(action);
  const remainingMs = expiresAt - Date.now();
  const isLocked = remainingMs > 0;
  if (action === "update") {
    button.disabled = button.classList.contains("is-updating") || isLocked;
  } else {
    button.disabled = isLocked;
  }
  const baseTitle = action === "update" ? "Update song list" : "Reshuffle remaining songs";
  button.title = isLocked ? `${baseTitle} — locked for ${Math.ceil(remainingMs / 3600000)} more hour(s)` : baseTitle;
  if (isLocked) {
    cooldownTimers[action] = window.setTimeout(() => refreshActionCooldown(action), remainingMs + 50);
  }
}

function startActionCooldown(action) {
  const key = action === "update" ? updateCooldownKey : shuffleCooldownKey;
  try {
    localStorage.setItem(key, String(Date.now()));
  } catch (error) {
    console.warn(`${action} cooldown could not be saved:`, error);
  }
  refreshActionCooldown(action);
}

refreshActionCooldown("update");
refreshActionCooldown("shuffle");
window.addEventListener("storage", event => {
  if (event.key === updateCooldownKey) refreshActionCooldown("update");
  if (event.key === shuffleCooldownKey) refreshActionCooldown("shuffle");
});

async function startRadio() {
  if (starting) return;
  starting = true;

  if (!songs.length) {
    songTitle.textContent = "गाने लोड हो रहे हैं…";
    try {
      // Prefer the locally saved full catalogue. Box is contacted at startup
      // only on first setup or when the local catalogue is unavailable.
      let cachedCatalogue = null;
      try {
        cachedCatalogue = JSON.parse(localStorage.getItem(catalogueKey) || "null");
      } catch (error) {
        cachedCatalogue = null;
      }

      if (Array.isArray(cachedCatalogue) && cachedCatalogue.length) {
        songs = cachedCatalogue;
      } else {
        const deviceName = await getDeviceName();
        const response = await fetch(
          `${API}/api/files?access=${encodeURIComponent(accessToken || "")}&device=${encodeURIComponent(deviceName)}&deviceId=${encodeURIComponent(deviceShortId)}`
        );
        const data = await response.json();

        if (!response.ok || !data.success || !Array.isArray(data.items)) {
          throw new Error("Playlist could not be loaded");
        }

        songs = data.items.filter(song =>
          song.type === "file" &&
          (song.extension || song.name.split(".").pop()).toLowerCase() === "mp3"
        );
        if (!songs.length) throw new Error("No MP3 files found");

        try {
          localStorage.setItem(catalogueKey, JSON.stringify(songs));
        } catch (storageError) {
          console.warn("Song catalogue could not be cached locally:", storageError);
        }
      }

      const currentIds = songs.map(song => String(song.id)).sort();

      // On the first run after this upgrade, use the old saved queue IDs as
      // the comparison baseline. This lets the first manual Update count
      // songs added since the user's previous catalogue was saved.
      try {
        if (!localStorage.getItem(updateBaselineKey)) {
          let oldQueue = null;
          try { oldQueue = JSON.parse(localStorage.getItem(queueKey) || "null"); } catch (error) {}
          const baselineIds = oldQueue && Array.isArray(oldQueue.allIds)
            ? oldQueue.allIds.map(String)
            : currentIds;
          localStorage.setItem(updateBaselineKey, JSON.stringify(baselineIds));
        }
      } catch (storageError) {
        console.warn("Update baseline could not be saved:", storageError);
      }

      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(queueKey) || "null");
      } catch (error) {
        saved = null;
      }

if (
  saved &&
  Array.isArray(saved.allIds) &&
  Array.isArray(saved.remainingIds) &&
  JSON.stringify(saved.allIds) === JSON.stringify(currentIds)
) {
  const songMap = new Map(songs.map(song => [String(song.id), song]));
  remaining = saved.remainingIds
    .map(id => songMap.get(String(id)))
    .filter(Boolean);
  // Restore full history snapshots where available. Older queues contain only IDs.
  const rawHistory = Array.isArray(saved.historySongs)
    ? saved.historySongs
    : (Array.isArray(saved.historyIds) ? saved.historyIds : []);
  const originalIndex = Number.isInteger(Number(saved.historyIndex))
    ? Number(saved.historyIndex)
    : rawHistory.length - 1;
  const restoredHistory = rawHistory.map((entry, originalPosition) => {
    const id = typeof entry === "object" && entry !== null ? entry.id : entry;
    const currentCatalogueSong = songMap.get(String(id));
    const song = currentCatalogueSong || (typeof entry === "object" && entry !== null ? entry : null);
    return song && song.id != null ? { song, originalPosition } : null;
  }).filter(Boolean).slice(-100);
  songHistory = restoredHistory.map(entry => entry.song);
  const savedCurrentId = saved.currentSongId == null ? null : String(saved.currentSongId);
  if (savedCurrentId !== null) {
    historyIndex = songHistory.map(song => String(song.id)).lastIndexOf(savedCurrentId);
  } else {
    // Account for history entries filtered out because they no longer exist in the catalogue.
    const retainedAtOrBeforePointer = restoredHistory.filter(entry => entry.originalPosition <= originalIndex).length;
    historyIndex = retainedAtOrBeforePointer - 1;
  }
  historyIndex = songHistory.length
    ? Math.min(Math.max(historyIndex, -1), songHistory.length - 1)
    : -1;
} else {
  remaining = shuffleSongs(songs);
  songHistory = [];
  historyIndex = -1;
}
    } catch (error) {
      console.error("Playlist error:", error);
      songTitle.textContent = "गाने लोड नहीं हुए। पेज फिर खोलें।";
      starting = false;
      return;
    }
  }

  playNext();
}


function playNext() {
  if (playbackMode === "favourites") {
    if (favouriteHistoryIndex < favouriteHistory.length - 1) {
      favouriteHistoryIndex++;
      currentSong = favouriteHistory[favouriteHistoryIndex];
      playSong(currentSong);
      return;
    }

    let availableFavourites = getAvailableFavouriteSongs();
    if (!availableFavourites.length) {
      playbackMode = "all";
      favouriteRemaining = [];
      favouriteHistory = [];
      favouriteHistoryIndex = -1;
      setFavouriteSettingsStatus("No playable Favourite songs remain. Returning to the full collection.");
      playNext();
      return;
    }
    if (!favouriteRemaining.length) {
      favouriteRemaining = shuffleSongs(availableFavourites.filter(song =>
        availableFavourites.length === 1 || !currentSong || String(song.id) !== String(currentSong.id)
      ));
      if (!favouriteRemaining.length) favouriteRemaining = shuffleSongs(availableFavourites);
    }
    currentSong = favouriteRemaining.pop();
    if (!currentSong) return;
    addToFavouriteHistory(currentSong);
    playSong(currentSong);
    return;
  }

  // If we previously went back, move forward in history first.
  if (historyIndex < songHistory.length - 1) {
    historyIndex++;
    currentSong = songHistory[historyIndex];
    saveQueue();
    playSong(currentSong);
    return;
  }

  // When a cycle is exhausted, begin a fresh shuffled cycle without
  // immediately repeating the song that just finished (unless it is the
  // only song available).
  if (!remaining.length) {
    const freshCycle = songs.filter(song =>
      songs.length === 1 || !currentSong || String(song.id) !== String(currentSong.id)
    );
    remaining = shuffleSongs(freshCycle.length ? freshCycle : songs);
  }

  currentSong = remaining.pop();

  if (!currentSong) return;

  addToSongHistory(currentSong);

  saveQueue();

  playSong(currentSong);
}

function playSong(song) {
  if (!song || song.id == null) return;
  const requestId = ++playbackRequestId;
  autoSkipTriggered = false;
  songTitle.textContent = song.name.replace(/\.mp3$/i, "");
  refreshFavouriteButton();

  if ("mediaSession" in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name.replace(/\.mp3$/i, ""),
      artist: "MyRadio",
      album: "मेरे पसंदीदा गाने"
    });
  }

  // Replace the source only after invalidating any earlier pending play request.
  player.pause();
  player.src = `${API}/api/audio?id=${encodeURIComponent(song.id)}&access=${encodeURIComponent(accessToken || "")}`;
  player.load();

  const playAttempt = player.play();
  if (playAttempt && typeof playAttempt.then === "function") {
    playAttempt.then(() => {
      if (requestId === playbackRequestId) starting = false;
    }).catch(error => {
      // A newer navigation may intentionally cancel this request.
      if (requestId !== playbackRequestId || error.name === "AbortError") return;
      console.error("Playback error:", error);
      songTitle.textContent = song.name.replace(/\.mp3$/i, "");
      starting = false;
    });
  } else {
    starting = false;
  }
}

player.addEventListener("ended", playNext);
  
let recoveryTimer = null;

player.addEventListener("ended", () => {
  if (recoveryTimer) {
    clearTimeout(recoveryTimer);
    recoveryTimer = null;
  }
});

document.addEventListener("visibilitychange", () => {
  if (!document.hidden && player.ended) {
    playNext();
  }
});

  
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("play", () => {
    player.play().catch(error => console.error(error));
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    player.pause();
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (songs.length) {
      player.pause();
      playNext();
    }
  });
}

const playPause = document.getElementById("playPause");
const progress = document.getElementById("progress");
const currentTime = document.getElementById("currentTime");
const duration = document.getElementById("duration");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const minutes = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${minutes}:${String(secs).padStart(2, "0")}`;
}

function saveQueue() {
  if (playbackMode === "favourites") return;
  try {
    localStorage.setItem(queueKey, JSON.stringify({
      allIds: songs.map(song => String(song.id)).sort(),
      remainingIds: remaining.map(song => String(song.id)),
      historyIds: songHistory.map(song => String(song.id)),
      historySongs: songHistory.map(song => ({ id: song.id, name: song.name, type: song.type, extension: song.extension })),
      historyIndex: historyIndex,
      currentSongId: currentSong ? String(currentSong.id) : null
    }));
  } catch (error) {
    console.error("Queue could not be saved:", error);
  }
}

const shuffleButton = document.getElementById("shuffleButton");
shuffleButton.addEventListener("click", () => {
  if (cooldownExpiry("shuffle") > Date.now()) return;
  if (playbackMode === "favourites") {
    const available = getAvailableFavouriteSongs();
    if (!available.length) return;

    // For a large Favourite collection, avoid the last 100 played tracks.
    // For a small collection, exclude only the current track so the queue
    // does not become unnecessarily empty.
    const excludedIds = available.length > 100
      ? getRecentPlayedIds(favouriteHistory, favouriteHistoryIndex, currentSong)
      : new Set(currentSong && currentSong.id != null ? [String(currentSong.id)] : []);
    const candidates = available.filter(song => !excludedIds.has(String(song.id)));
    if (!candidates.length) return;

    favouriteRemaining = shuffleSongs(candidates);
    animateShuffleButton();
    startActionCooldown("shuffle");
    return; // Keep the current song playing; the shuffled queue is for next.
  }

  if (!songs.length) return;
  const excludedIds = getRecentPlayedIds(songHistory, historyIndex, currentSong);
  const candidates = songs.filter(song => !excludedIds.has(String(song.id)));
  if (!candidates.length) return;

  remaining = shuffleSongs(candidates);
  saveQueue();
  animateShuffleButton();
  startActionCooldown("shuffle");
  // Shuffle changes only the remaining queue, never the current song.
});

const updateButton = document.getElementById("updateButton");
updateButton.addEventListener("click", async () => {
  if (updateButton.classList.contains("is-updating") || cooldownExpiry("update") > Date.now()) return;
  updateButton.classList.add("is-updating");
  updateButton.disabled = true;
  let updateSucceeded = false;

  try {
    const deviceName = await getDeviceName();
    const response = await fetch(
      `${API}/api/files?access=${encodeURIComponent(accessToken || "")}&device=${encodeURIComponent(deviceName)}&deviceId=${encodeURIComponent(deviceShortId)}`
    );
    const data = await response.json();
    if (!response.ok || !data.success || !Array.isArray(data.items)) {
      throw new Error("Playlist could not be updated");
    }

    const refreshedSongs = data.items.filter(song =>
      song.type === "file" &&
      (song.extension || song.name.split(".").pop()).toLowerCase() === "mp3"
    );
    if (!refreshedSongs.length) throw new Error("No MP3 files found");

    let previousIds = new Set(songs.map(song => String(song.id)));
    try {
      const savedBaseline = JSON.parse(localStorage.getItem(updateBaselineKey) || "null");
      if (Array.isArray(savedBaseline)) previousIds = new Set(savedBaseline.map(String));
    } catch (error) {}

    const newlyAddedCount = refreshedSongs.filter(
      song => !previousIds.has(String(song.id))
    ).length;
    const refreshedIds = new Set(refreshedSongs.map(song => String(song.id)));
    const removedCount = [...previousIds].filter(id => !refreshedIds.has(id)).length;
    // Show additions as a positive count, removals as a negative count.
    // If both happen in one update, show both changes (for example +2/-1).
    const updateCountText = newlyAddedCount && removedCount
      ? `+${newlyAddedCount}/-${removedCount}`
      : removedCount
        ? `-${removedCount}`
        : String(newlyAddedCount);

    // Commit the refreshed catalogue and comparison baseline only after the
    // Box request has succeeded and a usable MP3 list has been received.
    songs = refreshedSongs;
    try {
      localStorage.setItem(catalogueKey, JSON.stringify(songs));
      localStorage.setItem(updateBaselineKey, JSON.stringify(songs.map(song => String(song.id)).sort()));
    } catch (storageError) {
      console.warn("Updated catalogue could not be fully cached locally:", storageError);
    }
    // Preserve the existing unplayed order. Newly added tracks are shuffled
    // among themselves and placed at the front (the queue's next items are
    // popped from the end), while deleted tracks are removed.
    const refreshedSongMap = new Map(songs.map(song => [String(song.id), song]));
    const newSongs = refreshedSongs.filter(song => !previousIds.has(String(song.id)));
    const newSongIds = new Set(newSongs.map(song => String(song.id)));
    const preservedRemaining = remaining
      .filter(song => !newSongIds.has(String(song.id)))
      .map(song => refreshedSongMap.get(String(song.id)))
      .filter(Boolean);
    remaining = [...preservedRemaining, ...shuffleSongs(newSongs)];
    saveQueue();

    // Reconcile the Favourite queue with the refreshed catalogue too. Newly
    // added Box tracks enter this queue only if the user had already favourited
    // their IDs (for example, a previously unavailable Favourite returning).
    const availableFavouriteIds = new Set(getAvailableFavouriteSongs().map(song => String(song.id)));
    favouriteRemaining = favouriteRemaining
      .filter(song => availableFavouriteIds.has(String(song.id)))
      .map(song => refreshedSongMap.get(String(song.id)))
      .filter(Boolean);
    const queuedFavouriteIds = new Set(favouriteRemaining.map(song => String(song.id)));
    const recentFavouriteIds = getRecentPlayedIds(favouriteHistory, favouriteHistoryIndex, currentSong);
    const newlyAvailableFavourites = newSongs.filter(song =>
      availableFavouriteIds.has(String(song.id)) &&
      !queuedFavouriteIds.has(String(song.id)) &&
      !recentFavouriteIds.has(String(song.id)) &&
      (!currentSong || String(song.id) !== String(currentSong.id))
    );
    if (newlyAvailableFavourites.length) {
      favouriteRemaining = [...favouriteRemaining, ...shuffleSongs(newlyAvailableFavourites)];
    }
    const updateCount = document.getElementById("updateCount");
    updateCount.textContent = updateCountText;
    updateCount.classList.add("visible");
    updateSucceeded = true;
    window.clearTimeout(window.myRadioUpdateCountTimer);
    window.myRadioUpdateCountTimer = window.setTimeout(() => {
      updateCount.classList.remove("visible");
      updateCount.textContent = "";
    }, 9000);
  } catch (error) {
    console.error("Playlist update error:", error);
    songTitle.textContent = "गानों की सूची अपडेट नहीं हो सकी।";
  } finally {
    updateButton.classList.remove("is-updating");
    if (updateSucceeded) startActionCooldown("update");
    else refreshActionCooldown("update");
  }
});

playPause.addEventListener("click", async () => {
  if (player.paused) {
    if (!player.src || player.readyState === 0) {
      await startRadio();
    } else {
      try {
        await player.play();
      } catch (error) {
        console.error("Play error:", error);
      }
    }
  } else {
    player.pause();
  }
});

player.addEventListener("play", () => {
  playPause.textContent = "Ⅱ";
});

player.addEventListener("pause", () => {
  playPause.textContent = "▶";
});

player.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(player.duration);
});

player.addEventListener("timeupdate", () => {
  currentTime.textContent = formatTime(player.currentTime);
  if (Number.isFinite(player.duration) && player.duration > 0) {
    progress.value = (player.currentTime / player.duration) * 100;
  }

  if (
    !player.paused &&
    !player.ended &&
    currentSong &&
    !autoSkipTriggered &&
    autoSkipChoice !== "full" &&
    deferAutoSkipForSongId !== String(currentSong.id)
  ) {
    const threshold = autoSkipThreshold();
    // A fixed-minute choice longer than this song is ignored; natural end wins.
    if (Number.isFinite(threshold) && threshold < player.duration && player.currentTime >= threshold) {
      autoSkipTriggered = true;
      playNext();
    }
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(player.duration) && player.duration > 0) {
    player.currentTime = (Number(progress.value) / 100) * player.duration;
  }
});

document.getElementById("previousButton").addEventListener("click", () => {
  if (playbackMode === "favourites") {
    if (favouriteHistoryIndex <= 0) return;
    favouriteHistoryIndex--;
    currentSong = favouriteHistory[favouriteHistoryIndex];
    player.pause();
    playSong(currentSong);
    return;
  }

  // Original full-collection Previous behaviour.
  if (!songHistory.length) return;

  const currentId = currentSong && currentSong.id != null
    ? String(currentSong.id)
    : null;

  let currentIndex = currentId === null
    ? -1
    : songHistory.map(song => String(song.id)).lastIndexOf(currentId);

  if (currentIndex < 0 && Number.isInteger(historyIndex)) {
    currentIndex = historyIndex;
  }

  if (currentIndex <= 0 || currentIndex >= songHistory.length) return;

  const previousSong = songHistory[currentIndex - 1];
  if (!previousSong || previousSong.id == null) return;

  player.pause();
  historyIndex = currentIndex - 1;
  currentSong = previousSong;
  saveQueue();
  playSong(previousSong);
});

document.getElementById("skipButton").addEventListener("click", () => {
  if (songs.length) {
    player.pause();
    playNext();
  }
});

document.getElementById("exitButton").addEventListener("click", (event) => {
  event.preventDefault();
  event.stopPropagation();
  player.pause();

  // Restore the original behaviour: close if Chrome permits it;
  // otherwise return to the previous page in this tab.
  window.close();
  window.setTimeout(() => {
    window.history.back();
  }, 300);
});
  player.addEventListener("error", () => {
  console.error("Audio element error:", player.error);
  songTitle.textContent = "गाना चलाने में समस्या हुई।";
  starting = false;
});

player.addEventListener("play", () => {
  starting = false;
});

// Favourite and Settings controls.
document.getElementById("favouriteButton").addEventListener("click", toggleCurrentFavourite);
document.getElementById("settingsButton").addEventListener("click", openSettings);
document.getElementById("closeSettingsButton").addEventListener("click", closeSettings);
document.getElementById("settingsBackdrop").addEventListener("click", event => {
  if (event.target.id === "settingsBackdrop") closeSettings();
});
document.getElementById("playFavouritesButton").addEventListener("click", playFavourites);
document.getElementById("playAllSongsButton").addEventListener("click", () => {
  if (playbackMode === "all") return;
  playbackMode = "all";
  refreshPlaybackModeButtons();
  favouriteRemaining = [];
  favouriteHistory = [];
  favouriteHistoryIndex = -1;
  if (songs.length) {
    player.pause();
    playNext();
  }
});
document.getElementById("backupFavouritesButton").addEventListener("click", () => {
  if (!favouriteStorageReady) {
    setFavouriteSettingsStatus("Favourite storage is still loading. Please try again.");
    return;
  }
  exportFavouritesBackup();
});
document.getElementById("restoreFavouritesButton").addEventListener("click", restoreFavouritesFromRememberedFile);
document.getElementById("restoreFavouritesFile").addEventListener("change", async event => {
  const file = event.target.files && event.target.files[0];
  await importFavouritesBackup(file);
  event.target.value = "";
});
document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeSettings();
});
window.addEventListener("popstate", () => {
  const backdrop = document.getElementById("settingsBackdrop");
  if (backdrop && backdrop.classList.contains("open")) closeSettings(true);
});

initFavouriteStorage().finally(() => {
  refreshFavouriteButton();
  startRadio();
});
</script>
